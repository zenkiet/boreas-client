user nginx;
worker_processes auto;
worker_shutdown_timeout 10s;

error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    server_tokens off;

    sendfile on;
    sendfile_max_chunk 2m;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65s;
    keepalive_requests 1000;
    reset_timedout_connection on;

    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    client_max_body_size 1m;

    etag on;
    if_modified_since exact;

    open_file_cache max=10000 inactive=120s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/wasm
        application/xml
        application/xhtml+xml
        image/svg+xml;

    # TLS and HTTP/3 terminate at the edge; this image is a portable HTTP origin.
    server {
        listen 80 default_server reuseport;
        listen [::]:80 default_server reuseport;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        autoindex off;

        add_header_inherit merge;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header X-XSS-Protection "0" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location ~ /\.(?!well-known(?:/|$)) {
            return 404;
        }

        # The push service worker is unhashed; an immutable cache would pin old workers forever.
        location = /firebase-messaging-sw.js {
            try_files $uri =404;
            access_log off;
            add_header Cache-Control "no-cache" always;
        }

        location ~* \.(?:css|js|mjs|map|wasm)$ {
            try_files $uri =404;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?|ttf|otf)$ {
            try_files $uri =404;
            access_log off;
            add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        }

        location ~* \.(?:json|webmanifest|xml|txt)$ {
            try_files $uri =404;
            access_log off;
            add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
